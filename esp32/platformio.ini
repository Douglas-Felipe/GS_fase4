; =============================================================================
; LunarGrid - Configuração PlatformIO
; Sistema de Gerenciamento Energético para Base Lunar
; =============================================================================
; Para usar com Wokwi:
;   1. Instale a extensão Wokwi no VS Code
;   2. Compile o projeto: pio run
;   3. Inicie a simulação pelo Wokwi (F1 -> Wokwi: Start Simulator)
; =============================================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Dependências gerenciadas pelo PlatformIO
lib_deps =
    bblanchon/ArduinoJson@^7.1.0

; Configurações de compilação
monitor_speed = 115200
upload_speed = 921600

; Flags de build opcionais para otimização
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINO_ESP32_DEV
